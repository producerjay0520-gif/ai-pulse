name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true
          swift --version

      - name: Unit tests
        run: swift test

      - name: Build app bundle (universal, ad-hoc signed)
        run: UNIVERSAL=1 ./Scripts/build-app.sh --dmg

      - name: Smoke test
        run: ./Scripts/smoke-test.sh build/AIPulse.app

      - uses: actions/upload-artifact@v4
        with:
          name: AIPulse-unsigned
          path: |
            build/AIPulse-*.dmg
            build/AIPulse.mcpb
